name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          echo "" | base64 -d | tar xz
      - name: Build
        run: cd DamaAssist && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dama-assistant-apk
          path: DamaAssist/app/build/outputs/apk/debug/app-debug.apk
          
